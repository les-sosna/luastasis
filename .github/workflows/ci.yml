name: CI

on:
  push:
    branches: [stasis5.5]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - { name: vanilla, flag: "" }
          - { name: deterministic, flag: "DETERMINISTIC=1" }
    name: ${{ matrix.mode.name }}
    steps:
      - uses: actions/checkout@v6

      - name: Install libreadline (needed by testes/main.lua readline test)
        # The test runs `lua -E -i` and expects the warning handler to be
        # silent.  With -E the LUA_READLINELIB env override is ignored, so
        # lua falls back to dlopen("libreadline.so") -- which only resolves
        # when the -dev package is installed.
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Build (${{ matrix.mode.name }}, full test mode + API checks)
        run: |
          make ${{ matrix.mode.flag }} \
               TESTS='-DLUA_USER_H="\"ltests.h\"" -DLUA_USE_APICHECK -Og -g' \
               lua test_serial test_determinism test_json lstasis_tojson

      - name: Build upstream test C libs
        run: make -C testes/libs

      - name: LuaStasis serialization tests
        run: ./test_serial

      - name: LuaStasis determinism tests
        run: ./test_determinism

      - name: LuaStasis JSON snapshot tests
        # Goldens are only stable in deterministic builds.
        if: matrix.mode.name == 'deterministic'
        run: ./test_json

      - name: Upstream Lua test suite (full, with T library)
        working-directory: testes
        # `echo |` ensures stdin is a non-seekable pipe (testes/files.lua
        # depends on this).  PATH must include the freshly built lua so
        # io.popen("lua ...") subprocesses in the suite resolve correctly.
        run: |
          ulimit -S -s 1100
          export PATH="$PWD/..:$PATH"
          echo | ../lua -W all.lua
